appId: com.googlefoto.manager
productName: Google Foto Manager
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
publish:
  provider: github
  owner: sebastianoboem
  repo: GoogleFotoManager
  releaseType: release
afterAllArtifactBuild: scripts/rename-artifacts.cjs
mac:
  category: public.app-category.photography
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
